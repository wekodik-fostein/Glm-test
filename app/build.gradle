plugins {
    id 'com.android.application'
}

android {
    namespace 'com.erafox.chessassist'
    compileSdk 34

    defaultConfig {
        applicationId 'com.erafox.chessassist'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            // Uses the auto-generated Android debug keystore.
            // No keystore file needs to be present in the repo for `assembleDebug`.
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
